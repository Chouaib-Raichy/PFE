# =====================================================================
# Configuration GLOBALE heritee par TOUS les services (application.yml).
# Ne contient que des valeurs non sensibles. Les secrets doivent etre
# fournis par variables d'environnement (voir README).
# =====================================================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true
