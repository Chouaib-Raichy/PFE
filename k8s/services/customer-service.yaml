apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  labels:
    app: customer-service
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      initContainers:
        - name: wait-config-server
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O- http://config-server:8888/actuator/health >/dev/null 2>&1; do echo "attente config-server..."; sleep 3; done
        - name: wait-discovery
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O- http://discovery:8761/actuator/health >/dev/null 2>&1; do echo "attente discovery..."; sleep 3; done
        - name: wait-postgres
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "attente postgres..."; sleep 3; done
      containers:
        - name: customer-service
          image: pfe-customer-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery:8761/eureka
            # Secret du compte de service de provisionnement (cote serveur).
            - name: PROVISIONER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pfe-secrets
                  key: PROVISIONER_CLIENT_SECRET
            - name: CUSTOMER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pfe-secrets
                  key: CUSTOMER_DB_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  labels:
    app: customer-service
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  selector:
    app: customer-service
  ports:
    - name: http
      port: 8082
      targetPort: 8082
