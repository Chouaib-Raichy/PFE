apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  labels:
    app: product-service
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      initContainers:
        - name: wait-config-server
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O- http://config-server:8888/actuator/health >/dev/null 2>&1; do echo "attente config-server..."; sleep 3; done
        - name: wait-discovery
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O- http://discovery:8761/actuator/health >/dev/null 2>&1; do echo "attente discovery..."; sleep 3; done
        - name: wait-postgres
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo "attente postgres..."; sleep 3; done
      containers:
        - name: product-service
          image: pfe-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery:8761/eureka
            - name: PRODUCT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pfe-secrets
                  key: PRODUCT_DB_PASSWORD
            # Identifiants applicatifs a privilege minimal (crees par minio-init).
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pfe-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pfe-secrets
                  key: MINIO_SECRET_KEY
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app: product-service
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  selector:
    app: product-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
