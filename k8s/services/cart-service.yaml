apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  labels:
    app: cart-service
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      initContainers:
        - name: wait-config-server
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O- http://config-server:8888/actuator/health >/dev/null 2>&1; do echo "attente config-server..."; sleep 3; done
        - name: wait-discovery
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until wget -q -O- http://discovery:8761/actuator/health >/dev/null 2>&1; do echo "attente discovery..."; sleep 3; done
        - name: wait-mongo
          image: busybox:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z mongo 27017; do echo "attente mongo..."; sleep 3; done
      containers:
        - name: cart-service
          image: pfe-cart-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery:8761/eureka
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              memory: "768Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  labels:
    app: cart-service
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  selector:
    app: cart-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
