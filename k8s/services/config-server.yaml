apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    app: config-server
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: pfe-config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8888
          # Depot de configuration projete depuis config-repo/ (ConfigMap cree
          # par k8s/scripts/deploy.ps1 — source unique de verite).
          volumeMounts:
            - name: config-repo
              mountPath: /config-repo
              readOnly: true
          env:
            - name: CONFIG_REPO_LOCATION
              value: file:/config-repo
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8888
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "640Mi"
      volumes:
        - name: config-repo
          configMap:
            name: config-repo
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  labels:
    app: config-server
    app.kubernetes.io/part-of: pfe-ecommerce
spec:
  selector:
    app: config-server
  ports:
    - name: http
      port: 8888
      targetPort: 8888
