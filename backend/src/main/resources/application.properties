spring.application.name=pfe-flow
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pfe}
spring.datasource.username=${DB_USER:pfe}
spring.datasource.password=${DB_PASSWORD:pfe}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=pfe-flow

info.app.name=PFE Flow
info.app.description=Gestion des projets de fin d'études
info.app.version=1.0.0