# =====================================================================
# Prometheus — configuration de scrape de la stack E-commerce PFE.
# Toutes les cibles sont resolues par le DNS interne Docker (pfe-net),
# jamais par une URL hote. Chaque service Spring expose ses metriques
# Micrometer sur /actuator/prometheus.
#
# Ports internes :
#   config-server 8888 | discovery 8761 | product 8081 | customer 8082
#   cart 8083 | order 8084 | api-gateway 8081 (port de GESTION interne)
# =====================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: pfe-ecom

scrape_configs:
  - job_name: pfe-ecom
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ["config-server:8888"]
      - targets: ["discovery:8761"]
      - targets: ["product-service:8081"]
      - targets: ["customer-service:8082"]
      - targets: ["cart-service:8083"]
      - targets: ["order-service:8084"]
      - targets: ["api-gateway:8081"]
