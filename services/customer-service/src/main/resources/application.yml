spring:
  application:
    name: customer-service
  config:
    # Serveur de configuration centralise (surchargeable via CONFIG_SERVER_IMPORT).
    import: ${CONFIG_SERVER_IMPORT:configserver:http://config-server:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 1000
        max-interval: 3000
        multiplier: 1.5
